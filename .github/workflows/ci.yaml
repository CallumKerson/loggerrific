name: CI

on:
  pull_request:
    branches: ["main"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # to report the test results
    env:
      LINT_JUNITFILE: test-results/lint.junit.xml
      GOTESTSUM_JSONFILE: test-results/test.gotest.json
      GOTESTSUM_FORMAT: github-actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tooling
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - run: mkdir -p test-results && mise run ci
      - name: Report lint and test results
        if: ${{ !cancelled() }}
        uses: CallumKerson/test-reports-action@a4d5c4b4345ee9ddb62623a091af0bd90e322094 # v0.2.1
